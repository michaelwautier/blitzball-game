<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blitzball</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8f4ff;
        --panel: rgb(6 16 28 / 0.92);
        --edge: rgb(127 216 255 / 0.35);
        --good: #7ee38b;
        --bad: #ff8b7a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05080f;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The radar: the old top-down view, kept in the corner because a camera
         inside the pool cannot show you shape or marking. */
      #radar {
        position: fixed;
        bottom: 92px;
        right: 16px;
        width: min(230px, 26vw);
        aspect-ratio: 1;
        border: 1px solid rgb(127 216 255 / 0.25);
        border-radius: 12px;
        background: rgb(4 20 34 / 0.42);
        backdrop-filter: blur(3px);
        opacity: 0.9;
        pointer-events: none;
      }
      /* Time and score sit beneath the radar, as they do in FFX. */
      #scoreboard {
        position: fixed;
        bottom: 16px;
        right: 16px;
        width: min(230px, 26vw);
        pointer-events: none;
        text-shadow: 0 2px 10px rgb(0 0 0 / 0.9);
      }
      .sb-time,
      .sb-score {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 2px 4px;
        border-bottom: 2px solid rgb(127 216 255 / 0.55);
        font: 700 20px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .sb-time-label {
        font-size: 13px;
        letter-spacing: 0.12em;
        color: #ffd479;
      }
      .sb-time-value {
        color: #ffb35c;
        letter-spacing: 0.08em;
      }
      .sb-half {
        margin-left: auto;
        font-size: 11px;
        font-weight: 400;
        opacity: 0.5;
      }
      .sb-score {
        margin-top: 4px;
        justify-content: space-between;
      }
      .sb-team {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        letter-spacing: 0.06em;
        opacity: 0.8;
      }
      .sb-swatch {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .sb-goals {
        color: #ffb35c;
      }
      /* Events run along the bottom-left, one line each, as FFX calls them. */
      #banner {
        position: fixed;
        left: 20px;
        bottom: 20px;
        max-width: min(46ch, 50vw);
        font: 600 17px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        /* Announcements arrive newline-separated when several land at once. */
        white-space: pre-line;
        text-shadow: 0 2px 10px rgb(0 0 0 / 0.95);
        pointer-events: none;
      }
      /* A goal still takes the whole screen. It has earned it. */
      #banner.banner-emphatic {
        left: 50%;
        bottom: 50%;
        max-width: none;
        transform: translate(-50%, 50%);
        padding: 14px 32px;
        font: 700 44px ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
        color: var(--goal, #ffd479);
      }
      /* Dev-only, and it shares the bottom-left with the event line: it sits
         directly above so the two read as one column. Toggle with ~. */
      #debug {
        position: fixed;
        bottom: 76px;
        left: 12px;
        margin: 0;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.55);
        color: #9fe8ff;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre;
        pointer-events: none;
      }
      [hidden] {
        display: none !important;
      }

      /* Encounter menu */
      /* The decision box: FFX puts it top-left, narrow, titled. */
      #encounter {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(370px, calc(100vw - 32px));
        padding: 10px 12px 12px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.55);
        backdrop-filter: blur(8px);
      }
      .enc-heading {
        display: flex;
        gap: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgb(127 216 255 / 0.25);
        font-size: 12px;
        line-height: 1.4;
        opacity: 0.7;
      }
      .enc-hp {
        margin-left: auto;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .enc-option:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      .enc-option:disabled:hover {
        background: rgb(255 255 255 / 0.05);
        border-color: transparent;
      }
      .enc-odds {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
        font: 600 17px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .enc-vs {
        font-size: 13px;
        opacity: 0.5;
      }
      .enc-en {
        color: #9fe8ff;
      }
      .enc-at {
        color: var(--bad);
      }
      .enc-outcome {
        margin-left: auto;
        font-size: 13px;
      }
      .enc-outcome.good {
        color: var(--good);
      }
      .enc-outcome.bad {
        color: var(--bad);
      }
      .enc-outcome.mixed {
        color: #ffd479;
      }
      .enc-list {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .enc-option {
        display: grid;
        grid-template-columns: 20px 1fr;
        align-items: baseline;
        gap: 2px 10px;
        width: 100%;
        padding: 7px 10px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: rgb(255 255 255 / 0.05);
        color: inherit;
        font: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }
      .enc-option:hover {
        background: rgb(255 255 255 / 0.11);
        border-color: var(--edge);
      }
      .enc-option kbd {
        grid-row: 1 / span 2;
        align-self: center;
        min-width: 20px;
        padding: 2px 0;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.12);
        font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
      }
      .enc-label {
        font-weight: 600;
      }
      /* Under the label rather than beside it: the box is narrow now. */
      .enc-detail {
        grid-column: 2;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        opacity: 0.6;
      }
      .enc-safe .enc-detail {
        color: var(--good);
        opacity: 0.9;
      }
      .enc-risky .enc-detail {
        color: var(--bad);
        opacity: 0.9;
      }
      .enc-hint {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.45;
      }

      /* Who has the ball, and who is on them. FFX puts this top-right. */
      #stats {
        position: fixed;
        top: 14px;
        right: 16px;
        width: min(380px, 46vw);
        display: grid;
        gap: 3px;
        pointer-events: none;
        text-shadow: 0 2px 10px rgb(0 0 0 / 0.9);
      }
      .sp-row {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 10px;
        padding: 3px 8px;
        border-bottom: 2px solid rgb(127 216 255 / 0.5);
        background: linear-gradient(to right, transparent, rgb(6 16 28 / 0.55));
        font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .sp-name {
        margin-right: auto;
        font: 600 14px ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
      }
      /* Defenders read as the opposition: dimmer, and tinted against. */
      .sp-defender {
        background: linear-gradient(to right, transparent, rgb(60 12 12 / 0.5));
        border-bottom-color: rgb(255 139 122 / 0.45);
        font-size: 12px;
        opacity: 0.92;
      }
      .sp-stat b {
        color: #ffb35c;
        font-weight: 700;
      }
      .sp-stat i {
        margin-left: 2px;
        font-style: normal;
        font-size: 10px;
        opacity: 0.6;
      }

      /* League screen */
      #league {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        display: grid;
        align-content: start;
        justify-items: center;
        gap: 4px;
        padding: 40px 24px 64px;
        background: radial-gradient(120% 90% at 50% 0%, #0b2a44 0%, #05080f 70%);
      }
      .lg-title {
        margin: 0;
        font: 700 34px/1.1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.01em;
      }
      .lg-subtitle {
        margin: 0 0 26px;
        font-size: 14px;
        opacity: 0.6;
      }
      .lg-table {
        display: grid;
        /* pos, team, P W D L, goals, GD, pts */
        grid-template-columns: 28px minmax(150px, 1fr) repeat(4, 34px) 68px 46px 44px;
        gap: 2px 8px;
        width: min(640px, calc(100vw - 32px));
        margin-bottom: 30px;
        font: 14px ui-sans-serif, system-ui, sans-serif;
      }
      .lg-row {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: subgrid;
        align-items: center;
        padding: 7px 10px;
        border-radius: 8px;
        background: rgb(255 255 255 / 0.04);
      }
      .lg-row > span:not(.lg-team) {
        text-align: right;
        font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .lg-head {
        background: none;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.45;
      }
      .lg-mine {
        background: rgb(127 216 255 / 0.14);
        outline: 1px solid var(--edge);
      }
      .lg-pos {
        opacity: 0.5;
      }
      .lg-team {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        text-align: left;
      }
      .lg-swatch {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .lg-points {
        font-weight: 700;
      }
      .lg-fixtures {
        width: min(640px, calc(100vw - 32px));
        margin-bottom: 28px;
      }
      .lg-fixtures-title {
        margin: 0 0 10px;
        font: 11px ui-sans-serif, system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.45;
      }
      .lg-fixture {
        display: grid;
        grid-template-columns: 1fr 78px 1fr;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        margin-bottom: 4px;
        border-radius: 8px;
        background: rgb(255 255 255 / 0.04);
        font-size: 14px;
      }
      .lg-home {
        text-align: right;
      }
      .lg-score {
        text-align: center;
        font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace;
        opacity: 0.85;
      }
      .lg-play {
        padding: 12px 28px;
        border: 1px solid var(--edge);
        border-radius: 9px;
        background: rgb(127 216 255 / 0.14);
        color: inherit;
        font: 600 15px ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }
      .lg-play:hover:not(:disabled) {
        background: rgb(127 216 255 / 0.26);
      }
      .lg-play:disabled {
        opacity: 0.45;
        cursor: default;
      }

      /* Full-time summary */
      #summary {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 4px;
        padding: 24px;
        background: rgb(2 6 12 / 0.82);
        backdrop-filter: blur(6px);
        text-align: center;
      }
      .sum-score {
        margin: 0;
        font: 700 44px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.02em;
      }
      .sum-verdict {
        margin-bottom: 18px;
        font-size: 14px;
        opacity: 0.6;
      }
      .sum-list {
        list-style: none;
        margin: 0 0 20px;
        padding: 0;
        display: grid;
        gap: 4px;
        min-width: min(520px, calc(100vw - 48px));
      }
      .sum-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: baseline;
        gap: 14px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgb(255 255 255 / 0.05);
        text-align: left;
        font-size: 14px;
      }
      .sum-name {
        font-weight: 600;
      }
      .sum-exp {
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        opacity: 0.55;
      }
      .sum-level {
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--good);
      }
      .sum-gains {
        grid-column: 1 / -1;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9fe8ff;
      }
      .sum-empty {
        padding: 8px;
        font-size: 13px;
        opacity: 0.5;
      }
      .sum-again {
        justify-self: center;
        padding: 10px 22px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: rgb(255 255 255 / 0.07);
        color: inherit;
        font: 600 14px ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }
      .sum-again:hover {
        background: rgb(255 255 255 / 0.14);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="radar"></canvas>
    <div id="scoreboard"></div>
    <div id="banner" hidden></div>
    <pre id="debug"></pre>
    <div id="encounter" hidden></div>
    <div id="summary" hidden></div>
    <div id="stats" hidden></div>
    <div id="league" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
