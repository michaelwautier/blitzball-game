<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blitzball</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8f4ff;
        --panel: rgb(6 16 28 / 0.92);
        --edge: rgb(127 216 255 / 0.35);
        --good: #7ee38b;
        --bad: #ff8b7a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05080f;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #debug {
        position: fixed;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.55);
        color: #9fe8ff;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre;
        pointer-events: none;
      }
      [hidden] {
        display: none !important;
      }

      /* Encounter menu */
      #encounter {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        width: min(560px, calc(100vw - 32px));
        padding: 16px 18px;
        border: 1px solid var(--edge);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.55);
        backdrop-filter: blur(8px);
      }
      .enc-heading {
        display: flex;
        gap: 12px;
        font-size: 14px;
        opacity: 0.75;
      }
      .enc-hp {
        margin-left: auto;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .enc-option:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      .enc-option:disabled:hover {
        background: rgb(255 255 255 / 0.05);
        border-color: transparent;
      }
      .enc-odds {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-top: 6px;
        font: 600 20px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .enc-vs {
        font-size: 13px;
        opacity: 0.5;
      }
      .enc-en {
        color: #9fe8ff;
      }
      .enc-at {
        color: var(--bad);
      }
      .enc-outcome {
        margin-left: auto;
        font-size: 13px;
      }
      .enc-outcome.good {
        color: var(--good);
      }
      .enc-outcome.bad {
        color: var(--bad);
      }
      .enc-list {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .enc-option {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: rgb(255 255 255 / 0.05);
        color: inherit;
        font: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }
      .enc-option:hover {
        background: rgb(255 255 255 / 0.11);
        border-color: var(--edge);
      }
      .enc-option kbd {
        flex: none;
        min-width: 20px;
        padding: 2px 0;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.12);
        font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
      }
      .enc-label {
        font-weight: 600;
      }
      .enc-detail {
        margin-left: auto;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        opacity: 0.6;
      }
      .enc-safe .enc-detail {
        color: var(--good);
        opacity: 0.9;
      }
      .enc-risky .enc-detail {
        color: var(--bad);
        opacity: 0.9;
      }
      .enc-hint {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.45;
      }

      /* Full-time summary */
      #summary {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 4px;
        padding: 24px;
        background: rgb(2 6 12 / 0.82);
        backdrop-filter: blur(6px);
        text-align: center;
      }
      .sum-score {
        margin: 0;
        font: 700 44px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.02em;
      }
      .sum-verdict {
        margin-bottom: 18px;
        font-size: 14px;
        opacity: 0.6;
      }
      .sum-list {
        list-style: none;
        margin: 0 0 20px;
        padding: 0;
        display: grid;
        gap: 4px;
        min-width: min(520px, calc(100vw - 48px));
      }
      .sum-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: baseline;
        gap: 14px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgb(255 255 255 / 0.05);
        text-align: left;
        font-size: 14px;
      }
      .sum-name {
        font-weight: 600;
      }
      .sum-exp {
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        opacity: 0.55;
      }
      .sum-level {
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--good);
      }
      .sum-gains {
        grid-column: 1 / -1;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9fe8ff;
      }
      .sum-empty {
        padding: 8px;
        font-size: 13px;
        opacity: 0.5;
      }
      .sum-again {
        justify-self: center;
        padding: 10px 22px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: rgb(255 255 255 / 0.07);
        color: inherit;
        font: 600 14px ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }
      .sum-again:hover {
        background: rgb(255 255 255 / 0.14);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <pre id="debug"></pre>
    <div id="encounter" hidden></div>
    <div id="summary" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
